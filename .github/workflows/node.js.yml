name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Throwaway value used only to satisfy the encryption tests in this ephemeral CI environment - not a real secret
      PEPPER: ftOIKjYGK38MekzrwDoWqRjTDulOCTXuG4LOzI9jOQg=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test